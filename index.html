function getNilai(s){return NILAI_QURAN.find(n=>s>=n.min)||NILAI_QURAN[4];}
function gs(k,d=null){try{return JSON.parse(localStorage.getItem(k))??d;}catch{return d;}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function fmtDate(d){return new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});}
function hitungStreak(setor){
  if(!setor.length)return 0;
  const dates=[...new Set(setor.map(s=>new Date(s.tanggal).toDateString()))].sort((a,b)=>new Date(b)-new Date(a));
  let streak=0,cur=new Date();
  for(const d of dates){const diff=Math.round((cur-new Date(d))/86400000);if(diff<=1){streak++;cur=new Date(d);}else break;}
  return streak;
}

// ── SHARED UI ─────────────────────────────────────────────
function Card({children,style={},t}){
  return <div style={{background:t.card,borderRadius:16,padding:20,marginBottom:16,border:`1px solid ${t.border}`,boxShadow:"0 1px 8px rgba(0,0,0,0.04)",...style}}>{children}</div>;
}
function Btn({children,onClick,style={},disabled=false,t,variant="primary"}){
  const base={padding:"12px 20px",borderRadius:10,border:"none",cursor:disabled?"not-allowed":"pointer",fontWeight:600,fontSize:14,letterSpacing:0.3,transition:"opacity 0.15s",opacity:disabled?0.45:1,...style};
  const styles=variant==="primary"?{...base,background:t.btnBg,color:t.btnText}:variant==="outline"?{...base,background:"transparent",border:`1px solid ${t.accent}`,color:t.accent}:{...base,background:"transparent",border:"1px solid #ccc",color:C.ash};
  return <button onClick={onClick} disabled={disabled} style={styles}>{children}</button>;
}
function Input({value,onChange,placeholder,type="text",style={},t}){
  return <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={{width:"100%",padding:"11px 14px",borderRadius:10,border:`1px solid ${t.inputBorder}`,background:t.inputBg,fontSize:14,color:t.text,boxSizing:"border-box",...style}}/>;
}
function Select({value,onChange,children,style={},t}){
  return <select value={value} onChange={onChange} style={{width:"100%",padding:"11px 14px",borderRadius:10,border:`1px solid ${t.inputBorder}`,background:t.inputBg,fontSize:14,color:t.text,boxSizing:"border-box",appearance:"none",...style}}>{children}</select>;
}
function Textarea({value,onChange,placeholder,rows=3,t}){
  return <textarea value={value} onChange={onChange} placeholder={placeholder} rows={rows} style={{width:"100%",padding:"11px 14px",borderRadius:10,border:`1px solid ${t.inputBorder}`,background:t.inputBg,fontSize:14,color:t.text,boxSizing:"border-box",resize:"vertical",lineHeight:1.6}}/>;
}
function Lbl({children,t}){return <div style={{fontSize:11,fontWeight:600,letterSpacing:1.5,color:t.accent,textTransform:"uppercase",marginBottom:6,marginTop:16}}>{children}</div>;}
function PBar({pct,t}){return <div style={{background:t.accentLight,borderRadius:99,height:6,overflow:"hidden",marginTop:8}}><div style={{width:`${pct}%`,background:t.accent,height:"100%",borderRadius:99,transition:"width 0.5s ease"}}/></div>;}
function PageHdr({title,sub,onBack,t}){
  return <div style={{marginBottom:28}}>
    {onBack&&<button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:t.accent,fontSize:13,fontWeight:500,padding:0,marginBottom:14,letterSpacing:0.2}}>Kembali</button>}
    <div style={{fontSize:22,fontWeight:700,color:t.text,lineHeight:1.2}}>{title}</div>
    {sub&&<div style={{fontSize:13,fontWeight:400,color:t.sub,marginTop:4}}>{sub}</div>}
  </div>;
}
function Empty({msg,t}){return <div style={{textAlign:"center",padding:48,color:t.sub}}><div style={{fontSize:32,marginBottom:12,opacity:0.3}}>—</div><div style={{fontSize:14,fontWeight:400}}>{msg}</div></div>;}
function StatRow({label,val,t}){return <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${t.border}`}}><span style={{fontSize:13,fontWeight:400,color:t.sub}}>{label}</span><span style={{fontSize:13,fontWeight:600,color:t.text}}>{val}</span></div>;}
function Toast({toast}){
  if(!toast)return null;
  return <div style={{position:"fixed",top:68,left:"50%",transform:"translateX(-50%)",background:toast.type==="success"?"#1A3A2A":"#6B1A1A",color:"#F5F0E8",padding:"10px 24px",borderRadius:8,zIndex:9999,fontSize:13,fontWeight:500,boxShadow:"0 4px 16px rgba(0,0,0,0.15)",whiteSpace:"nowrap"}}>{toast.msg}</div>;
}

// ── DASHBOARD ─────────────────────────────────────────────
function Dashboard({user,quranStor,matanStor,quranNilai,matanNilai,matanList,setPage,t}){
  const isBumi=user.role==="bumi";
  const halamanSelesai=[...new Set(quranNilai.map(n=>n.setorId))].length;
  const totalTarget=100;
  const pct=Math.min(100,Math.round((halamanSelesai/totalTarget)*100));
  const lastQN=quranNilai.length?quranNilai[quranNilai.length-1]:null;
  const lastNilai=lastQN?getNilai(lastQN.skor):null;
  const baitSelesai=matanNilai.filter(n=>n.status==="lancar").length;
  const quranPending=quranStor.filter(s=>!quranNilai.find(n=>n.setorId===s.id)).length;
  const matanPending=matanStor.filter(s=>!matanNilai.find(n=>n.setorId===s.id)).length;
  const streak=hitungStreak(isBumi?quranStor:matanStor);
  const days=Math.max(0,Math.round((new Date("2027-01-01")-new Date())/86400000));

  if(isBumi) return <DashBumi {...{pct,halamanSelesai,totalTarget,lastNilai,lastQN,baitSelesai,matanPending,quranPending,streak,setPage,quranNilai,days,t}}/>;
  const lastMN=matanNilai.length?matanNilai[matanNilai.length-1]:null;
  return <DashDhiana {...{pct,halamanSelesai,totalTarget,lastNilai,lastQN,baitSelesai,matanList,matanPending,quranPending,streak,setPage,matanNilai,lastMN,days,t}}/>;
}

// ── SETOR QURAN ───────────────────────────────────────────
function SetorQuran({user,quranStor,setQuranStor,showToast,setPage,t}){
  const [tipe,setTipe]=useState("ziyadah");
  const [juz,setJuz]=useState("1");
  const [juzCustom,setJuzCustom]=useState("");
  const [surah,setSurah]=useState("Al-Baqarah");
  const [surahCustom,setSurahCustom]=useState("");
  const [ayatDari,setAyatDari]=useState("");
  const [ayatSampai,setAyatSampai]=useState("");
  const [jumlahHal,setJumlahHal]=useState("1");
  const [halCustom,setHalCustom]=useState("");
  const [catatan,setCatatan]=useState("");
  const surahFinal=surah==="__custom__"?surahCustom:surah;
  const juzFinal=juz==="__custom__"?juzCustom:juz;
  const halFinal=jumlahHal==="__custom__"?halCustom:jumlahHal;
  const isUKJ=tipe==="ukj";

  const TIPE_OPTS=[
    {val:"ziyadah",label:"Ziyadah",sub:"Hafalan baru"},
    {val:"murajaah",label:"Muraja'ah",sub:"Pengulangan"},
    {val:"ukj",label:"UKJ",sub:"Ujian Kenaikan Juz"},
  ];

  function submit(){
    if(isUKJ&&!juzFinal)return showToast("Pilih juz yang diujikan","error");
    if(!isUKJ&&(!surahFinal))return showToast("Pilih atau tulis nama surat","error");
    if(!isUKJ&&(!ayatDari||!ayatSampai))return showToast("Isi range ayat","error");
    const data={
      id:Date.now(),tipe,juz:juzFinal,
      surah:isUKJ?`Juz ${juzFinal} (UKJ)`:surahFinal,
      ayatDari:isUKJ?null:parseInt(ayatDari),
      ayatSampai:isUKJ?null:parseInt(ayatSampai),
      jumlahHal:isUKJ?20:halFinal,
      catatan,tanggal:new Date().toISOString(),setorBy:user.id
    };
    setQuranStor(prev=>[...prev,data]);
    showToast("Setoran berhasil dicatat");
    setAyatDari("");setAyatSampai("");setCatatan("");setJumlahHal("1");
    setTimeout(()=>setPage("dashboard"),1500);
  }

  return <div>
    <PageHdr title="Setor Hafalan Al-Qur'an" sub="Pilih jenis setoran" onBack={()=>setPage("dashboard")} t={t}/>
    <Card t={t}>
      <Lbl t={t}>Jenis Setoran</Lbl>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:4}}>
        {TIPE_OPTS.map(opt=><button key={opt.val} onClick={()=>setTipe(opt.val)} style={{padding:"12px 6px",borderRadius:10,border:"none",cursor:"pointer",background:tipe===opt.val?t.accent:t.accentLight,color:tipe===opt.val?t.accentText:t.accent,transition:"all 0.15s",textAlign:"center"}}>
          <div style={{fontWeight:700,fontSize:13,fontFamily:"'Poppins',sans-serif"}}>{opt.label}</div>
          <div style={{fontSize:10,fontWeight:400,marginTop:3,opacity:0.75}}>{opt.sub}</div>
        </button>)}
      </div>
    </Card>

    <Card t={t}>
      <Lbl t={t}>Juz</Lbl>
      <Select value={juz} onChange={e=>setJuz(e.target.value)} t={t}>
        {JUZ_LIST.map(j=><option key={j.juz} value={j.juz}>Juz {j.juz} — {j.nama}</option>)}
        <option value="__custom__">Lainnya (ketik sendiri)</option>
      </Select>
      {juz==="__custom__"&&<Input value={juzCustom} onChange={e=>setJuzCustom(e.target.value)} placeholder="Tulis juz ke-..." style={{marginTop:8}} t={t}/>}

      {!isUKJ&&<>
        <Lbl t={t}>{tipe==="murajaah"?"Surat yang Diulang":"Nama Surat"}</Lbl>
        <Select value={surah} onChange={e=>setSurah(e.target.value)} t={t}>
          {SUWAR_LIST.map(s=><option key={s} value={s}>{s}</option>)}
          <option value="__custom__">Lainnya (ketik sendiri)</option>
        </Select>
        {surah==="__custom__"&&<Input value={surahCustom} onChange={e=>setSurahCustom(e.target.value)} placeholder="Tulis nama surat..." style={{marginTop:8}} t={t}/>}

        <Lbl t={t}>{tipe==="murajaah"?"Ayat yang Diulang":"Ayat"}</Lbl>
        <div style={{display:"grid",gridTemplateColumns:"1fr 24px 1fr",gap:8,alignItems:"center"}}>
          <Input type="number" value={ayatDari} onChange={e=>setAyatDari(e.target.value)} placeholder="Dari" t={t}/>
          <div style={{textAlign:"center",color:t.sub,fontSize:14}}>—</div>
          <Input type="number" value={ayatSampai} onChange={e=>setAyatSampai(e.target.value)} placeholder="Sampai" t={t}/>
        </div>

        <Lbl t={t}>Jumlah Halaman</Lbl>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {["1","2","3","4","5","__custom__"].map(n=><button key={n} onClick={()=>setJumlahHal(n)} style={{flex:n==="__custom__"?"1 1 100%":1,padding:"10px 4px",borderRadius:8,border:"none",cursor:"pointer",background:jumlahHal===n?t.accent:t.accentLight,color:jumlahHal===n?t.accentText:t.accent,fontWeight:600,fontSize:n==="__custom__"?13:16,fontFamily:"'Poppins',sans-serif",marginTop:n==="__custom__"?4:0}}>{n==="__custom__"?"Lainnya (ketik sendiri)":n}</button>)}
        </div>
        {jumlahHal==="__custom__"&&<Input type="number" value={halCustom} onChange={e=>setHalCustom(e.target.value)} placeholder="Jumlah halaman..." style={{marginTop:8}} t={t}/>}
      </>}

      {isUKJ&&<div style={{marginTop:12,background:t.accentLight,borderRadius:10,padding:14}}>
        <div style={{fontSize:13,fontWeight:600,color:t.accent}}>UKJ — Ujian Kenaikan Juz {juzFinal}</div>
        <div style={{fontSize:12,fontWeight:400,color:t.sub,marginTop:4,lineHeight:1.6}}>Seluruh isi juz akan diujikan. Penilaian mencakup kelancaran, tajwid, makhraj, dan keputusan lanjut atau ulang.</div>
      </div>}

      <Lbl t={t}>Catatan untuk Penyimak</Lbl>
      <Textarea value={catatan} onChange={e=>setCatatan(e.target.value)} placeholder="Opsional — bagian yang berat, pertanyaan, dll." t={t}/>
      <Btn onClick={submit} style={{width:"100%",padding:14,marginTop:16}} t={t}>Kirim Setoran</Btn>
    </Card>

    {quranStor.length>0&&<Card t={t}>
      <div style={{fontSize:11,fontWeight:600,letterSpacing:2,color:t.sub,textTransform:"uppercase",marginBottom:12}}>Riwayat Terakhir</div>
      {quranStor.slice(-4).reverse().map(s=>{
        const cfg=TIPE_CONFIG[s.tipe||"ziyadah"];
        return <div key={s.id} style={{padding:"10px 0",borderBottom:`1px solid ${t.border}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                <span style={{fontSize:10,fontWeight:600,letterSpacing:1,color:cfg.badgeText,background:cfg.badgeBg,border:`1px solid ${cfg.borderColor}`,borderRadius:4,padding:"1px 7px"}}>{cfg.label}</span>
              </div>
              <span style={{fontWeight:600,fontSize:14,color:t.text}}>{s.surah} — Juz {s.juz}</span>
            </div>
            <span style={{fontSize:12,fontWeight:400,color:t.sub}}>{new Date(s.tanggal).toLocaleDateString("id-ID")}</span>
          </div>
          {s.ayatDari&&<div style={{fontSize:13,fontWeight:400,color:t.sub,marginTop:2}}>Ayat {s.ayatDari}–{s.ayatSampai} · {s.jumlahHal} halaman</div>}
        </div>;
      })}
    </Card>}
  </div>;
}

// ── NILAI QURAN ───────────────────────────────────────────
function NilaiQuran({user,quranStor,quranNilai,setQuranNilai,showToast,setPage,t}){
  const pending=quranStor.filter(s=>!quranNilai.find(n=>n.setorId===s.id));
  const [sel,setSel]=useState(pending[0]||null);
  const [kelancaran,setKelancaran]=useState(4);
  const [tajwid,setTajwid]=useState(4);
  const [makhraj,setMakhraj]=useState(4);
  const [keputusan,setKeputusan]=useState("lanjut");
  const [catatan,setCatatan]=useState("");
  const isUKJ=sel?.tipe==="ukj";

  function submit(){
    if(!sel)return;
    const skor=Math.round(((kelancaran+tajwid+makhraj)/12)*100);
    const nilai={
      id:Date.now(),setorId:sel.id,tipe:sel.tipe||"ziyadah",
      surah:sel.surah,ayatDari:sel.ayatDari,ayatSampai:sel.ayatSampai,
      juz:sel.juz,skor,kelancaran,tajwid,makhraj,
      keputusan:isUKJ?keputusan:null,
      catatan,tanggal:new Date().toISOString()
    };
    setQuranNilai(prev=>[...prev,nilai]);
    const msg=isUKJ?`UKJ Juz ${sel.juz} — ${keputusan==="lanjut"?"Lanjut":"Perlu Ulang"} (${skor})`:`Penilaian tersimpan — ${getNilai(skor).label}`;
    showToast(msg);
    const next=pending.filter(p=>p.id!==sel.id)[0];
    setSel(next||null);setCatatan("");setKelancaran(4);setTajwid(4);setMakhraj(4);setKeputusan("lanjut");
  }

  if(!pending.length)return <div><PageHdr title="Nilai Hafalan Qur'an" onBack={()=>setPage("dashboard")} t={t}/><Card t={t}><Empty msg="Tidak ada setoran yang menunggu penilaian" t={t}/></Card></div>;
  const skor=Math.round(((kelancaran+tajwid+makhraj)/12)*100);
  const nPrev=getNilai(skor);

  return <div>
    <PageHdr title="Nilai Hafalan Qur'an" sub={`${pending.length} setoran menunggu`} onBack={()=>setPage("dashboard")} t={t}/>
    {pending.length>1&&<div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
      {pending.map(p=>{
        const cfg=TIPE_CONFIG[p.tipe||"ziyadah"];
        return <button key={p.id} onClick={()=>setSel(p)} style={{padding:"6px 14px",borderRadius:20,border:sel?.id===p.id?`1.5px solid ${t.accent}`:`1px solid ${cfg.borderColor}`,background:sel?.id===p.id?t.accent:cfg.badgeBg,color:sel?.id===p.id?t.accentText:cfg.badgeText,cursor:"pointer",fontSize:12,fontWeight:500}}>
          {cfg.label} — {p.tipe==="ukj"?`Juz ${p.juz}`:`${p.surah}`}
        </button>;
      })}
    </div>}

    {sel&&<Card t={t}>
      {/* HEADER INFO */}
      <div style={{background:t.accentLight,borderRadius:10,padding:16,marginBottom:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:11,fontWeight:600,letterSpacing:2,color:t.accent,textTransform:"uppercase"}}>Setoran Bumi</div>
            <div style={{fontSize:18,fontWeight:700,color:t.text,marginTop:4}}>{sel.surah} — Juz {sel.juz}</div>
            {sel.ayatDari&&<div style={{fontSize:14,fontWeight:400,color:t.accent,marginTop:2}}>Ayat {sel.ayatDari}–{sel.ayatSampai} · {sel.jumlahHal} halaman</div>}
            <div style={{fontSize:12,fontWeight:400,color:t.sub,marginTop:4}}>{new Date(sel.tanggal).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}</div>
            {sel.catatan&&<div style={{marginTop:8,fontSize:13,fontWeight:400,color:t.text}}>Catatan: {sel.catatan}</div>}
          </div>
          {(()=>{const cfg=TIPE_CONFIG[sel.tipe||"ziyadah"];return<span style={{fontSize:11,fontWeight:600,letterSpacing:1,color:cfg.badgeText,background:cfg.badgeBg,border:`1px solid ${cfg.borderColor}`,borderRadius:4,padding:"3px 10px",whiteSpace:"nowrap"}}>{cfg.label}</span>;})()}
        </div>
      </div>

      {/* RATING */}
      {[{label:"Kelancaran",val:kelancaran,set:setKelancaran,opts:["Banyak salah","Kurang lancar","Cukup lancar","Sangat lancar"]},
        {label:"Tajwid",val:tajwid,set:setTajwid,opts:["Banyak salah","Perlu koreksi","Cukup baik","Sangat baik"]},
        {label:"Makhraj",val:makhraj,set:setMakhraj,opts:["Banyak salah","Perlu koreksi","Cukup baik","Sangat baik"]}
      ].map(item=><div key={item.label}>
        <Lbl t={t}>{item.label}</Lbl>
        <div style={{display:"flex",gap:8,marginBottom:4}}>
          {[1,2,3,4].map(v=><button key={v} onClick={()=>item.set(v)} style={{flex:1,padding:"10px 4px",borderRadius:8,border:"none",cursor:"pointer",background:item.val===v?t.accent:t.accentLight,color:item.val===v?t.accentText:t.accent,fontWeight:700,fontSize:16,fontFamily:"'Poppins',sans-serif"}}>{v}</button>)}
        </div>
        <div style={{fontSize:12,fontWeight:400,color:t.sub,textAlign:"center",marginBottom:4}}>{item.opts[item.val-1]}</div>
      </div>)}

      {/* PREDIKSI NILAI */}
      <div style={{background:t.accentLight,borderRadius:10,padding:14,margin:"16px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontSize:11,fontWeight:600,letterSpacing:2,color:t.accent,textTransform:"uppercase"}}>Nilai</div><div style={{fontSize:18,fontWeight:700,color:t.text,marginTop:2}}>{nPrev.label}</div><div style={{fontSize:13,color:t.accent}}>{nPrev.arab}</div></div>
        <div style={{fontSize:36,fontWeight:700,color:t.accent}}>{skor}</div>
      </div>

      {/* KEPUTUSAN UKJ */}
      {isUKJ&&<>
        <Lbl t={t}>Keputusan UKJ</Lbl>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:4}}>
          {[{val:"lanjut",label:"Lanjut Juz Berikutnya",sub:"Nilai memenuhi syarat"},{val:"ulang",label:"Perlu Ulang Juz Ini",sub:"Perlu perbaikan lebih lanjut"}].map(opt=><button key={opt.val} onClick={()=>setKeputusan(opt.val)} style={{padding:14,borderRadius:10,border:"none",cursor:"pointer",background:keputusan===opt.val?(opt.val==="lanjut"?C.green:C.red):t.accentLight,color:keputusan===opt.val?"#F5F0E8":t.text,textAlign:"left",transition:"all 0.2s"}}>
            <div style={{fontWeight:700,fontSize:13,fontFamily:"'Poppins',sans-serif"}}>{opt.label}</div>
            <div style={{fontSize:11,fontWeight:400,marginTop:3,opacity:0.75}}>{opt.sub}</div>
          </button>)}
        </div>
        <div style={{fontSize:12,fontWeight:400,color:t.sub,marginBottom:4}}>Batas minimal lanjut: Jayyid (70)</div>
      </>}

      <Lbl t={t}>Catatan untuk Bumi</Lbl>
      <Textarea value={catatan} onChange={e=>setCatatan(e.target.value)} placeholder="Koreksi, motivasi, atau catatan penyimak..." t={t}/>
      <Btn onClick={submit} style={{width:"100%",padding:14,marginTop:12}} t={t}>Kirim Penilaian</Btn>
    </Card>}
  </div>;
}

// ── SETOR MATAN ───────────────────────────────────────────
function SetorMatan({user,matanStor,setMatanStor,matanList,showToast,setPage,t}){
  const [selBab,setSelBab]=useState("Semua");
  const [checked,setChecked]=useState({});
  const [catatan,setCatatan]=useState("");
  const babs=["Semua",...new Set(matanList.map(b=>b.bab))];
  const filtered=selBab==="Semua"?matanList:matanList.filter(b=>b.bab===selBab);
  const checkedIds=Object.keys(checked).filter(k=>checked[k]).map(Number);
  const allChecked=filtered.length>0&&filtered.every(b=>checked[b.id]);

  function toggleAll(){const next={...checked};filtered.forEach(b=>{next[b.id]=!allChecked;});setChecked(next);}
  function setor(){
    if(!checkedIds.length)return showToast("Pilih minimal 1 bait","error");
    const baitDipilih=matanList.filter(b=>checkedIds.includes(b.id));
    const newStor=baitDipilih.map((bait,i)=>({id:Date.now()+i,baitId:bait.id,arab:bait.arab,latin:bait.latin,arti:bait.arti,bab:bait.bab,catatan,tanggal:new Date().toISOString(),setorBy:user.id}));
    setMatanStor(prev=>[...prev,...newStor]);
    showToast(`${checkedIds.length} bait berhasil disetorkan`);
    setChecked({});setCatatan("");
    setTimeout(()=>setPage("dashboard"),1500);
  }
  return <div>
    <PageHdr title="Setor Hafalan Matan" sub="Al-Muqaddimah Al-Jazariyyah (Urjuzah)" onBack={()=>setPage("dashboard")} t={t}/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
      {babs.map(b=><button key={b} onClick={()=>setSelBab(b)} style={{padding:"5px 14px",borderRadius:20,border:"none",fontSize:12,fontWeight:500,background:selBab===b?t.accent:t.accentLight,color:selBab===b?t.accentText:t.accent,cursor:"pointer"}}>{b}</button>)}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <button onClick={toggleAll} style={{padding:"5px 14px",borderRadius:20,border:`1px solid ${t.accent}`,background:"transparent",color:t.accent,cursor:"pointer",fontSize:12,fontWeight:500}}>{allChecked?"Batal Semua":"Pilih Semua"}</button>
      <span style={{fontSize:12,fontWeight:500,color:t.sub}}>{checkedIds.length>0?`${checkedIds.length} dipilih`:""}</span>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:checkedIds.length>0?180:16}}>
      {filtered.map(bait=>{
        const sudah=matanStor.filter(s=>s.baitId===bait.id).length;
        const isCk=!!checked[bait.id];
        return <div key={bait.id} onClick={()=>setChecked(p=>({...p,[bait.id]:!p[bait.id]}))} style={{background:isCk?t.accentLight:"#fff",borderRadius:12,padding:14,cursor:"pointer",border:`1px solid ${isCk?t.accent:t.border}`,transition:"all 0.15s"}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
            <div style={{width:20,height:20,borderRadius:4,border:`1.5px solid ${t.accent}`,background:isCk?t.accent:"transparent",flexShrink:0,marginTop:3,display:"flex",alignItems:"center",justifyContent:"center"}}>
              {isCk&&<div style={{width:10,height:10,borderRadius:2,background:t.accentText}}/>}
            </div>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:6}}>
                <span style={{background:t.accent,color:t.accentText,borderRadius:4,padding:"1px 8px",fontSize:11,fontWeight:600}}>#{bait.id}</span>
                <span style={{fontSize:11,fontWeight:500,color:t.sub}}>{bait.bab}</span>
                {sudah>0&&<span style={{fontSize:11,fontWeight:500,color:C.green,background:"rgba(26,74,46,0.08)",padding:"1px 8px",borderRadius:4}}>{sudah}x disetorkan</span>}
              </div>
              <div style={{fontSize:18,color:t.text,lineHeight:2,textAlign:"right",direction:"rtl",marginBottom:4}}>{bait.arab}</div>
              <div style={{fontSize:12,fontWeight:400,color:t.accent,fontStyle:"italic",marginBottom:2}}>{bait.latin}</div>
              <div style={{fontSize:12,fontWeight:400,color:t.sub}}>{bait.arti}</div>
            </div>
          </div>
        </div>;
      })}
    </div>
    {checkedIds.length>0&&<div style={{position:"fixed",bottom:0,left:0,right:0,padding:16,background:"#fff",borderTop:`1px solid ${t.border}`,zIndex:200}}>
      <div style={{maxWidth:800,margin:"0 auto"}}>
        <Textarea value={catatan} onChange={e=>setCatatan(e.target.value)} placeholder="Catatan untuk Bumi (opsional)" rows={2} t={t}/>
        <Btn onClick={setor} style={{width:"100%",padding:13,fontSize:14,marginTop:8}} t={t}>Setorkan {checkedIds.length} Bait</Btn>
      </div>
    </div>}
  </div>;
}

// ── NILAI MATAN ───────────────────────────────────────────
function NilaiMatan({user,matanStor,matanNilai,setMatanNilai,matanList,showToast,setPage,t}){
  const pending=matanStor.filter(s=>!matanNilai.find(n=>n.setorId===s.id));
  const [sel,setSel]=useState(pending[0]||null);
  const [status,setStatus]=useState("lancar");
  const [catatan,setCatatan]=useState("");

  function submit(){
    if(!sel)return;
    const nilai={id:Date.now(),setorId:sel.id,baitId:sel.baitId,bab:sel.bab,status,catatan,tanggal:new Date().toISOString()};
    setMatanNilai(prev=>[...prev,nilai]);
    showToast(`Penilaian disimpan — Bait #${sel.baitId}`);
    const next=pending.filter(p=>p.id!==sel.id)[0];
    setSel(next||null);setCatatan("");setStatus("lancar");
  }
  if(!pending.length)return <div><PageHdr title="Nilai Matan Urjuzah" onBack={()=>setPage("dashboard")} t={t}/><Card t={t}><Empty msg="Tidak ada setoran yang menunggu penilaian" t={t}/></Card></div>;
  return <div>
    <PageHdr title="Nilai Matan Urjuzah" sub={`${pending.length} bait menunggu`} onBack={()=>setPage("dashboard")} t={t}/>
    {pending.length>1&&<div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>{pending.map(p=><button key={p.id} onClick={()=>setSel(p)} style={{padding:"6px 14px",borderRadius:20,border:"none",background:sel?.id===p.id?t.accent:t.accentLight,color:sel?.id===p.id?t.accentText:t.accent,cursor:"pointer",fontSize:12,fontWeight:500}}>Bait #{p.baitId}</button>)}</div>}
    {sel&&<Card t={t}>
      <div style={{background:t.accentLight,borderRadius:10,padding:16,marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:2,color:t.accent,textTransform:"uppercase"}}>Setoran Dhiana — {sel.bab}</div>
        <div style={{fontSize:20,color:t.text,lineHeight:2,textAlign:"right",direction:"rtl",marginTop:8}}>{sel.arab}</div>
        <div style={{fontSize:13,fontWeight:400,color:t.accent,fontStyle:"italic",marginTop:4}}>{sel.latin}</div>
        <div style={{fontSize:13,fontWeight:400,color:t.sub,marginTop:2}}>{sel.arti}</div>
        <div style={{fontSize:12,fontWeight:400,color:t.sub,marginTop:8}}>{new Date(sel.tanggal).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}</div>
      </div>
      <Lbl t={t}>Status Hafalan</Lbl>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {[{val:"lancar",label:"Sudah Lancar",sub:"Hafalan lancar"},{val:"ulang",label:"Perlu Diulang",sub:"Perlu muraja'ah"}].map(opt=><button key={opt.val} onClick={()=>setStatus(opt.val)} style={{padding:16,borderRadius:10,border:"none",cursor:"pointer",background:status===opt.val?t.accent:t.accentLight,color:status===opt.val?t.accentText:t.text,textAlign:"left",transition:"all 0.2s"}}>
          <div style={{fontWeight:600,fontSize:14,fontFamily:"'Poppins',sans-serif"}}>{opt.label}</div>
          <div style={{fontSize:11,fontWeight:400,marginTop:4,opacity:0.75}}>{opt.sub}</div>
        </button>)}
      </div>
      <Lbl t={t}>Catatan untuk Dhiana</Lbl>
      <Textarea value={catatan} onChange={e=>setCatatan(e.target.value)} placeholder="Koreksi, motivasi, atau catatan penyimak..." t={t}/>
      <Btn onClick={submit} style={{width:"100%",padding:14,marginTop:12}} t={t}>Kirim Penilaian</Btn>
    </Card>}
  </div>;
}

// ── RIWAYAT ───────────────────────────────────────────────
function Riwayat({user,quranStor,setQuranStor,matanStor,setMatanStor,quranNilai,setQuranNilai,matanNilai,setMatanNilai,showToast,t}){
  const isBumi=user.role==="bumi";
  const [tab,setTab]=useState(isBumi?"quran":"matan");
  const [konfirmId,setKonfirmId]=useState(null);

  function hapusQN(id){const n=quranNilai.find(x=>x.id===id);setQuranNilai(p=>p.filter(x=>x.id!==id));if(n)setQuranStor(p=>p.filter(x=>x.id!==n.setorId));setKonfirmId(null);showToast("Setoran dibatalkan");}
  function hapusMN(id){const n=matanNilai.find(x=>x.id===id);setMatanNilai(p=>p.filter(x=>x.id!==id));if(n)setMatanStor(p=>p.filter(x=>x.id!==n.setorId));setKonfirmId(null);showToast("Setoran dibatalkan");}

  return <div>
    <PageHdr title="Riwayat" sub="Rekap perjalanan hafalan" t={t}/>
    <div style={{display:"flex",gap:8,marginBottom:20}}>
      {[{key:"quran",label:"Al-Qur'an"},{key:"matan",label:"Matan"}].map(tb=><button key={tb.key} onClick={()=>setTab(tb.key)} style={{padding:"8px 20px",borderRadius:20,border:"none",cursor:"pointer",background:tab===tb.key?t.accent:t.accentLight,color:tab===tb.key?t.accentText:t.accent,fontWeight:600,fontSize:13}}>{tb.label}</button>)}
    </div>
    {tab==="quran"&&<div>
      {quranNilai.length===0&&<Empty msg="Belum ada penilaian Al-Qur'an" t={t}/>}
      {[...quranNilai].reverse().map(n=>{
        const ni=getNilai(n.skor);
        const cfg=TIPE_CONFIG[n.tipe||"ziyadah"];
        const isCf=konfirmId===n.id;
        const isUKJ=n.tipe==="ukj";
        return <div key={n.id} style={{background:"#fff",borderRadius:14,marginBottom:12,borderLeft:`3px solid ${cfg.borderColor}`,boxShadow:"0 1px 6px rgba(0,0,0,0.04)",overflow:"hidden"}}>
          <div style={{padding:"14px 16px"}}>
            {/* TOP ROW */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:15,color:t.text}}>{n.surah||`Juz ${n.juz}`} {n.ayatDari?`— Ayat ${n.ayatDari}–${n.ayatSampai}`:""}</div>
                <div style={{fontSize:12,fontWeight:400,color:t.sub,marginTop:2}}>{fmtDate(n.tanggal)}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                <span style={{fontSize:10,fontWeight:600,letterSpacing:1,color:cfg.badgeText,background:cfg.badgeBg,border:`1px solid ${cfg.borderColor}`,borderRadius:4,padding:"2px 8px"}}>{cfg.label}</span>
                {isUKJ
                  ?<span style={{fontSize:12,fontWeight:700,color:n.keputusan==="lanjut"?C.green:C.red,padding:"2px 10px",borderRadius:20,border:`1px solid ${n.keputusan==="lanjut"?C.green:C.red}`}}>{n.keputusan==="lanjut"?"Lanjut":"Ulang"}</span>
                  :<div style={{textAlign:"right"}}><div style={{fontSize:14,fontWeight:700,color:t.accent}}>{ni.label}</div><div style={{fontSize:20,fontWeight:700,color:t.text}}>{n.skor}</div></div>
                }
              </div>
            </div>
            {n.catatan&&<div style={{background:t.accentLight,borderRadius:8,padding:"8px 10px",fontSize:13,fontWeight:400,color:t.text,marginBottom:8}}>"{n.catatan}"</div>}
            <div style={{display:"flex",gap:12,fontSize:11,fontWeight:400,color:t.sub}}>
              <span>Kelancaran {n.kelancaran}/4</span><span>Tajwid {n.tajwid}/4</span><span>Makhraj {n.makhraj}/4</span>
            </div>
            {!isCf?<button onClick={()=>setKonfirmId(n.id)} style={{marginTop:10,padding:"3px 12px",borderRadius:6,border:`1px solid rgba(139,26,26,0.25)`,background:"transparent",color:C.red,cursor:"pointer",fontSize:12,fontWeight:500}}>Batalkan</button>
            :<div style={{marginTop:10,background:"rgba(139,26,26,0.04)",borderRadius:8,padding:10,border:"1px solid rgba(139,26,26,0.12)"}}>
              <div style={{fontSize:13,fontWeight:400,color:C.red,marginBottom:8}}>Yakin ingin membatalkan? Nilai dihapus dan setoran kembali ke pending.</div>
              <div style={{display:"flex",gap:8}}><button onClick={()=>hapusQN(n.id)} style={{padding:"5px 14px",borderRadius:6,border:"none",background:C.red,color:"#fff",cursor:"pointer",fontSize:12,fontWeight:600}}>Ya, batalkan</button><button onClick={()=>setKonfirmId(null)} style={{padding:"5px 14px",borderRadius:6,border:`1px solid ${t.border}`,background:"transparent",color:t.sub,cursor:"pointer",fontSize:12}}>Tidak</button></div>
            </div>}
          </div>
        </div>;
      })}
    </div>}
    {tab==="matan"&&<div>
      {matanNilai.length===0&&<Empty msg="Belum ada penilaian matan" t={t}/>}
      {[...matanNilai].reverse().map(n=>{const isCf=konfirmId===n.id;return <Card key={n.id} t={t}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:600,fontSize:15,color:t.text}}>Bait #{n.baitId}</div><div style={{fontSize:12,fontWeight:400,color:t.sub,marginTop:2}}>{n.bab} — {fmtDate(n.tanggal)}</div></div>
          <div style={{fontSize:12,fontWeight:600,color:n.status==="lancar"?C.green:C.red,padding:"4px 12px",borderRadius:20,border:`1px solid ${n.status==="lancar"?C.green:C.red}`}}>{n.status==="lancar"?"Lancar":"Perlu Ulang"}</div>
        </div>
        {n.catatan&&<div style={{marginTop:10,background:t.accentLight,borderRadius:8,padding:10,fontSize:13,fontWeight:400,color:t.text}}>"{n.catatan}"</div>}
        {!isCf?<button onClick={()=>setKonfirmId(n.id)} style={{marginTop:10,padding:"4px 12px",borderRadius:6,border:`1px solid rgba(139,26,26,0.3)`,background:"transparent",color:C.red,cursor:"pointer",fontSize:12,fontWeight:500}}>Batalkan setoran ini</button>
        :<div style={{marginTop:10,background:"rgba(139,26,26,0.05)",borderRadius:8,padding:12,border:"1px solid rgba(139,26,26,0.15)"}}>
          <div style={{fontSize:13,fontWeight:400,color:C.red,marginBottom:8}}>Yakin ingin membatalkan?</div>
          <div style={{display:"flex",gap:8}}><button onClick={()=>hapusMN(n.id)} style={{padding:"6px 16px",borderRadius:6,border:"none",background:C.red,color:"#fff",cursor:"pointer",fontSize:13,fontWeight:600}}>Ya, batalkan</button><button onClick={()=>setKonfirmId(null)} style={{padding:"6px 16px",borderRadius:6,border:`1px solid ${t.border}`,background:"transparent",color:t.sub,cursor:"pointer",fontSize:13}}>Tidak</button></div>
        </div>}
      </Card>;})}
    </div>}
  </div>;
}

// ── REKOMENDASI ───────────────────────────────────────────
function Rekomendasi({user,quranNilai,matanNilai,quranStor,matanStor,matanList,t}){
  const isBumi=user.role==="bumi";
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);

  async function getRekomendasi(){
    setLoading(true);setResult(null);
    try{
      const ctx=isBumi
        ?`Santri bernama Bumi sedang menghafal Al-Qur'an target 10 Juz (fokus Al-Baqarah) sebelum Januari 2027. Data penilaian terbaru: ${JSON.stringify(quranNilai.slice(-5))}. Total setoran: ${quranStor.length}, dinilai: ${quranNilai.length}. Berikan rekomendasi singkat padat: apakah perlu muraja'ah atau lanjut ziyadah, dan tips spesifik. Bahasa formal, to the point.`
        :`Santriwati bernama Dhiana sedang menghafal Matan Al-Muqaddimah Al-Jazariyyah (Urjuzah). Data penilaian terbaru: ${JSON.stringify(matanNilai.slice(-5))}. Total setoran: ${matanStor.length}, bait lancar: ${matanNilai.filter(n=>n.status==="lancar").length} dari ${matanList.length}. Berikan rekomendasi singkat padat: apakah perlu muraja'ah atau lanjut bait berikutnya. Bahasa formal, to the point.`;
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:ctx}]})});
      const data=await res.json();
      setResult(data.content?.[0]?.text||"Tidak ada rekomendasi saat ini.");
    }catch(e){setResult("Gagal mengambil rekomendasi. Pastikan koneksi internet stabil.");}
    setLoading(false);
  }

  const rataQ=quranNilai.length?Math.round(quranNilai.reduce((a,n)=>a+n.skor,0)/quranNilai.length):0;
  return <div>
    <PageHdr title="Rekomendasi AI" sub="Analisis progres dan saran lanjutan" t={t}/>
    <Card t={t}>
      <div style={{fontSize:13,fontWeight:400,color:t.sub,marginBottom:16,lineHeight:1.7}}>{isBumi?"Analisis progres hafalan Al-Qur'an dan rekomendasi apakah perlu muraja'ah atau lanjut ziyadah.":"Analisis progres hafalan Matan Urjuzah dan rekomendasi langkah selanjutnya."}</div>
      <Btn onClick={getRekomendasi} disabled={loading} style={{width:"100%",padding:13,opacity:loading?0.6:1}} t={t}>{loading?"Menganalisis...":"Minta Rekomendasi"}</Btn>
    </Card>
    {result&&<Card t={t} style={{background:t.accentLight}}>
      <div style={{fontSize:11,fontWeight:600,letterSpacing:2,color:t.accent,textTransform:"uppercase",marginBottom:12}}>Rekomendasi</div>
      <div style={{whiteSpace:"pre-wrap",lineHeight:1.8,fontSize:14,fontWeight:400,color:t.text}}>{result}</div>
    </Card>}
    <Card t={t}>
      <div style={{fontSize:11,fontWeight:600,letterSpacing:2,color:t.sub,textTransform:"uppercase",marginBottom:12}}>Statistik</div>
      {isBumi
        ?<><StatRow label="Total Setoran" val={quranStor.length} t={t}/><StatRow label="Sudah Dinilai" val={quranNilai.length} t={t}/><StatRow label="Rata-rata Skor" val={quranNilai.length?`${rataQ}/100`:"—"} t={t}/><StatRow label="Nilai Terbaik" val={quranNilai.length?getNilai(Math.max(...quranNilai.map(n=>n.skor))).label:"—"} t={t}/></>
        :<><StatRow label="Total Setoran" val={matanStor.length} t={t}/><StatRow label="Bait Lancar" val={matanNilai.filter(n=>n.status==="lancar").length} t={t}/><StatRow label="Perlu Diulang" val={matanNilai.filter(n=>n.status==="ulang").length} t={t}/><StatRow label="Progress" val={`${Math.round((matanNilai.filter(n=>n.status==="lancar").length/matanList.length)*100)}%`} t={t}/></>
      }
    </Card>
  </div>;
}

// ── MAIN APP ──────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [toast,setToast]=useState(null);
  const [quranStor,setQuranStor]=useState(()=>gs("quran_stor",[]));
  const [matanStor,setMatanStor]=useState(()=>gs("matan_stor",[]));
  const [quranNilai,setQuranNilai]=useState(()=>gs("quran_nilai",[]));
  const [matanNilai,setMatanNilai]=useState(()=>gs("matan_nilai",[]));
  const [matanList]=useState(()=>gs("matan_list",URJUZAH));

  useEffect(()=>{ss("quran_stor",quranStor);},[quranStor]);
  useEffect(()=>{ss("matan_stor",matanStor);},[matanStor]);
  useEffect(()=>{ss("quran_nilai",quranNilai);},[quranNilai]);
  useEffect(()=>{ss("matan_nilai",matanNilai);},[matanNilai]);

  function showToast(msg,type="success"){setToast({msg,type});setTimeout(()=>setToast(null),3000);}

  if(!user)return <LoginPage onLogin={setUser}/>;
  const t=theme(user.role);
  const shared={user,quranStor,setQuranStor,matanStor,setMatanStor,quranNilai,setQuranNilai,matanNilai,setMatanNilai,matanList,showToast,setPage,t};

  return <div style={{minHeight:"100vh",background:t.bg}}>
    <TopBar user={user} page={page} setPage={setPage} onLogout={()=>{setUser(null);setPage("dashboard");}} t={t}/>
    <Toast toast={toast}/>
    <div style={{maxWidth:720,margin:"0 auto",padding:"28px 16px"}}>
      {page==="dashboard"&&<Dashboard {...shared}/>}
      {page==="setor-quran"&&<SetorQuran {...shared}/>}
      {page==="nilai-quran"&&<NilaiQuran {...shared}/>}
      {page==="setor-matan"&&<SetorMatan {...shared}/>}
      {page==="nilai-matan"&&<NilaiMatan {...shared}/>}
      {page==="riwayat"&&<Riwayat {...shared}/>}
      {page==="rekomendasi"&&<Rekomendasi {...shared}/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
